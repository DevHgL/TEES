name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pokemanager
          POSTGRES_PASSWORD: pokemanager
          POSTGRES_DB: pokemanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemanager -d pokemanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://pokemanager:pokemanager@localhost:5432/pokemanager_test?schema=public
      # O prisma.config.ts lê DATABASE_URL ao rodar as migrations dos testes.
      DATABASE_URL: postgresql://pokemanager:pokemanager@localhost:5432/pokemanager_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Gera o Prisma Client
        run: npx prisma generate

      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - name: Testes unitários e E2E
        run: npm run test:coverage

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: pokemanager-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
